<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperPilot Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    .markdown-body h1 { font-size: 1.55rem; line-height: 2rem; font-weight: 700; margin: 1rem 0 .75rem; color: #111827; }
    .markdown-body h2 { font-size: 1.28rem; line-height: 1.8rem; font-weight: 700; margin: 1rem 0 .65rem; color: #1f2937; }
    .markdown-body h3 { font-size: 1.08rem; line-height: 1.55rem; font-weight: 650; margin: .85rem 0 .5rem; color: #374151; }
    .markdown-body p { margin: .62rem 0; line-height: 1.75; }
    .markdown-body ul, .markdown-body ol { margin: .62rem 0 .62rem 1.25rem; line-height: 1.75; }
    .markdown-body ul { list-style: disc; }
    .markdown-body ol { list-style: decimal; }
    .markdown-body blockquote { border-left: 4px solid #93c5fd; padding: .25rem .9rem; margin: .8rem 0; background: #eff6ff; color: #334155; }
    .markdown-body code:not(pre code) { background: #eff6ff; color: #1d4ed8; padding: .08rem .32rem; border-radius: .3rem; font-size: .9em; }
    .markdown-body pre { margin: .85rem 0; border-radius: .65rem; overflow: auto; border: 1px solid #dbeafe; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: .85rem 0; font-size: .92rem; }
    .markdown-body th, .markdown-body td { border: 1px solid #dbeafe; padding: .5rem .65rem; text-align: left; }
    .markdown-body th { background: #eff6ff; color: #1e3a8a; }
    .chat-scrollbar::-webkit-scrollbar { width: 8px; }
    .chat-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    .session-delete-button { opacity: 0; pointer-events: none; transform: translateX(2px) scale(.96); transition: opacity .14s ease, transform .14s ease, background-color .14s ease, color .14s ease; }
    .session-row:hover .session-delete-button, .session-row:focus-within .session-delete-button { opacity: .82; pointer-events: auto; transform: translateX(0) scale(1); }
    .session-delete-button:hover, .session-delete-button:focus-visible { background: rgba(244, 63, 94, .14); color: #fda4af; opacity: 1; }
    .session-delete-button:active { transform: scale(.92); }
    .session-delete-tooltip { position: absolute; top: 50%; right: calc(100% + 8px); z-index: 10; border: 1px solid rgba(255, 255, 255, .12); border-radius: .375rem; background: #111827; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); color: #e5e7eb; font-size: .75rem; line-height: 1; opacity: 0; padding: .35rem .5rem; pointer-events: none; transform: translate(2px, -50%); transition: opacity .14s ease, transform .14s ease; white-space: nowrap; }
    .session-delete-button:hover .session-delete-tooltip, .session-delete-button:focus-visible .session-delete-tooltip { opacity: 1; transform: translate(0, -50%); }
  </style>
</head>
<body class="h-screen overflow-hidden bg-white text-slate-900">
  <div class="flex h-screen">
    <aside id="sidebar" class="hidden w-[260px] shrink-0 flex-col bg-[#202123] text-slate-100 md:flex">
      <div class="border-b border-white/10 p-3">
        <div class="mb-3 flex items-center gap-2 px-1">
          <div class="flex h-8 w-8 items-center justify-center rounded-md bg-blue-600 text-sm font-bold">P</div>
          <div>
            <div class="text-sm font-semibold">PaperPilot</div>
            <div class="text-xs text-slate-400">论文精读助手</div>
          </div>
        </div>
        <button id="newChatButton" type="button" class="flex h-11 w-full items-center justify-center gap-2 rounded-md border border-white/20 px-3 text-sm font-medium transition hover:bg-white/10">
          <span class="text-lg leading-none">+</span>
          新建对话
        </button>
      </div>

      <nav id="conversationList" class="chat-scrollbar flex-1 space-y-1 overflow-y-auto p-2"></nav>

      <div class="border-t border-white/10 p-3">
        <button type="button" class="flex h-10 w-full items-center justify-start gap-2 rounded-md px-3 text-sm text-slate-300 hover:bg-white/10">
          <span>⚙️</span>
          设置
          <span class="ml-auto text-xs text-slate-500">占位</span>
        </button>
      </div>
    </aside>

    <main class="flex min-w-0 flex-1 flex-col bg-white">
      <header class="flex h-14 shrink-0 items-center justify-between border-b border-slate-200 px-4">
        <div class="flex min-w-0 items-center gap-3">
          <button id="mobileNewChatButton" type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 text-xl text-slate-700 md:hidden">+</button>
          <div class="min-w-0">
            <h1 id="currentTitle" class="truncate text-base font-semibold text-slate-900">新的论文对话</h1>
            <p id="statusText" class="truncate text-xs text-slate-500">可上传论文或直接提问</p>
          </div>
        </div>
        <div id="topLoading" class="hidden items-center gap-2 rounded-full bg-blue-50 px-3 py-1.5 text-xs font-medium text-blue-700">
          <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-blue-200 border-t-blue-700"></span>
          处理中
        </div>
      </header>

      <section id="messageList" class="chat-scrollbar flex-1 overflow-y-auto bg-slate-50 px-4 py-6">
        <div id="welcomeState" class="mx-auto flex h-full max-w-3xl flex-col items-center justify-center text-center">
          <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 text-2xl text-white">🤖</div>
          <h2 class="mt-5 text-2xl font-semibold text-slate-900">PaperPilot</h2>
          <p class="mt-2 max-w-md text-sm leading-6 text-slate-500">上传 PDF 后附带问题发送，也可以直接围绕论文、Agent、LLM、RAG 提问。</p>
        </div>
      </section>

      <footer class="shrink-0 border-t border-slate-200 bg-white p-3">
        <div id="uploadProgressWrap" class="mx-auto mb-2 hidden max-w-3xl rounded-md border border-blue-100 bg-blue-50 px-3 py-2">
          <div class="mb-1 flex items-center justify-between text-xs text-blue-700">
            <span id="uploadProgressText">正在上传 PDF...</span>
            <span id="uploadProgressValue">0%</span>
          </div>
          <div class="h-1.5 overflow-hidden rounded-full bg-blue-100">
            <div id="uploadProgressBar" class="h-full w-0 rounded-full bg-blue-600 transition-all"></div>
          </div>
        </div>

        <div id="pendingAttachmentWrap" class="mx-auto mb-2 hidden max-w-3xl">
          <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-700">
            <span aria-hidden="true">📄</span>
            <span id="pendingAttachmentName" class="min-w-0 flex-1 truncate"></span>
            <button id="removePendingAttachmentButton" type="button" aria-label="移除 PDF 附件" class="flex h-6 w-6 shrink-0 items-center justify-center rounded text-lg leading-none text-slate-500 hover:bg-slate-200 hover:text-slate-900 disabled:cursor-not-allowed disabled:opacity-50">×</button>
          </div>
        </div>

        <div class="relative mx-auto flex max-w-3xl items-end gap-2 rounded-xl border border-slate-300 bg-white p-2 shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100">
          <button id="plusButton" type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-2xl text-slate-600 transition hover:bg-slate-100">+</button>
          <div id="plusMenu" class="absolute bottom-16 left-2 hidden w-56 overflow-hidden rounded-lg border border-slate-200 bg-white shadow-xl">
            <button id="uploadPdfMenuItem" type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left text-sm hover:bg-slate-50">
              <span>📄</span>
              上传 PDF
            </button>
            <button id="arxivMenuItem" type="button" class="flex w-full items-center gap-3 px-4 py-3 text-left text-sm hover:bg-slate-50">
              <span>🔍</span>
              搜索 arxiv
            </button>
          </div>
          <textarea id="messageInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行" class="max-h-40 min-h-10 flex-1 resize-none border-0 bg-transparent px-1 py-2 text-sm leading-6 text-slate-900 outline-none placeholder:text-slate-400"></textarea>
          <button id="sendButton" type="button" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-blue-600 text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-slate-300">
            <span class="text-lg">↑</span>
          </button>
        </div>
        <input id="pdfInput" class="hidden" type="file" accept="application/pdf,.pdf">
      </footer>
    </main>
  </div>

  <script>
    const conversationList = document.getElementById("conversationList");
    const newChatButton = document.getElementById("newChatButton");
    const mobileNewChatButton = document.getElementById("mobileNewChatButton");
    const currentTitle = document.getElementById("currentTitle");
    const statusText = document.getElementById("statusText");
    const messageList = document.getElementById("messageList");
    const welcomeState = document.getElementById("welcomeState");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const plusButton = document.getElementById("plusButton");
    const plusMenu = document.getElementById("plusMenu");
    const uploadPdfMenuItem = document.getElementById("uploadPdfMenuItem");
    const arxivMenuItem = document.getElementById("arxivMenuItem");
    const pdfInput = document.getElementById("pdfInput");
    const topLoading = document.getElementById("topLoading");
    const uploadProgressWrap = document.getElementById("uploadProgressWrap");
    const uploadProgressText = document.getElementById("uploadProgressText");
    const uploadProgressValue = document.getElementById("uploadProgressValue");
    const uploadProgressBar = document.getElementById("uploadProgressBar");
    const pendingAttachmentWrap = document.getElementById("pendingAttachmentWrap");
    const pendingAttachmentName = document.getElementById("pendingAttachmentName");
    const removePendingAttachmentButton = document.getElementById("removePendingAttachmentButton");

    let conversations = [];
    let activeSessionId = "";
    let isGenerating = false;
    const CURRENT_SESSION_STORAGE_KEY = "paperpilot_current_session_id";

    marked.setOptions({
      breaks: true,
      highlight(code, language) {
        if (language && hljs.getLanguage(language)) {
          return hljs.highlight(code, { language }).value;
        }
        return hljs.highlightAuto(code).value;
      }
    });

    function createUuid() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return "session-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function getActiveConversation() {
      return conversations.find((item) => item.sessionId === activeSessionId);
    }

    function saveCurrentSessionId() {
      try {
        localStorage.setItem(CURRENT_SESSION_STORAGE_KEY, activeSessionId);
      } catch {
        // Browsers with disabled storage still keep the current in-memory session.
      }
    }

    function clearSavedSessionId() {
      try {
        localStorage.removeItem(CURRENT_SESSION_STORAGE_KEY);
      } catch {
        // Ignore disabled browser storage.
      }
    }

    function setLoading(isLoading, text = "") {
      topLoading.classList.toggle("hidden", !isLoading);
      topLoading.classList.toggle("inline-flex", isLoading);
      sendButton.disabled = isLoading;
      plusButton.disabled = isLoading;
      removePendingAttachmentButton.disabled = isLoading;
      statusText.textContent = text || "可上传论文或直接提问";
    }

    function setUploadProgress(percent, text = "正在上传 PDF...") {
      uploadProgressWrap.classList.remove("hidden");
      uploadProgressText.textContent = text;
      uploadProgressValue.textContent = `${percent}%`;
      uploadProgressBar.style.width = `${percent}%`;
    }

    function hideUploadProgress() {
      uploadProgressWrap.classList.add("hidden");
      uploadProgressBar.style.width = "0%";
      uploadProgressValue.textContent = "0%";
    }

    function renderPendingAttachment() {
      const attachment = getActiveConversation()?.pendingAttachment;
      pendingAttachmentWrap.classList.toggle("hidden", !attachment);
      pendingAttachmentName.textContent = attachment?.filename || "";
    }

    function renderConversationList() {
      conversationList.innerHTML = "";
      conversations.forEach((conversation) => {
        const row = document.createElement("div");
        row.className = [
          "session-row group flex min-h-9 w-full items-center gap-1 rounded-lg px-2 py-1 transition-colors",
          conversation.sessionId === activeSessionId
            ? "bg-white/15 text-white"
            : "text-slate-300 hover:bg-white/10 hover:text-white"
        ].join(" ");
        const button = document.createElement("button");
        button.type = "button";
        button.disabled = isGenerating;
        button.className = "flex min-w-0 flex-1 items-center gap-2 rounded-md px-1 py-1.5 text-left text-sm outline-none focus-visible:ring-2 focus-visible:ring-white/30 disabled:cursor-not-allowed";
        button.innerHTML = `<span class="shrink-0">💬</span><span class="truncate">${escapeHtml(conversation.title)}</span>`;
        button.addEventListener("click", () => switchConversation(conversation.sessionId));
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.setAttribute("aria-label", "删除对话");
        deleteButton.disabled = isGenerating;
        deleteButton.className = "session-delete-button relative flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-slate-500 outline-none focus-visible:ring-2 focus-visible:ring-rose-200/50 disabled:cursor-not-allowed disabled:opacity-30";
        deleteButton.innerHTML = `<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v5"></path><path d="M14 11v5"></path></svg><span class="session-delete-tooltip" role="tooltip" aria-hidden="true">删除对话</span>`;
        deleteButton.addEventListener("click", (event) => {
          event.stopPropagation();
          deleteConversation(conversation.sessionId);
        });
        row.append(button, deleteButton);
        conversationList.appendChild(row);
      });
    }

    function renderMessages(shouldScroll = true) {
      const conversation = getActiveConversation();
      const messages = conversation ? conversation.messages : [];
      messageList.innerHTML = "";
      if (!messages.length) {
        messageList.appendChild(welcomeState);
        welcomeState.classList.remove("hidden");
      } else {
        welcomeState.classList.add("hidden");
        messages.forEach((message) => {
          messageList.appendChild(createMessageElement(message));
        });
      }
      if (shouldScroll) {
        scrollToBottom();
      }
    }

    function createMessageElement(message) {
      const row = document.createElement("div");
      const isUser = message.role === "user";
      row.className = `mx-auto mb-5 flex max-w-3xl gap-3 ${isUser ? "justify-end" : "justify-start"}`;

      const avatar = document.createElement("div");
      avatar.className = "mt-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-slate-200 text-base";
      avatar.textContent = isUser ? "👤" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = isUser
        ? "max-w-[78%] rounded-2xl rounded-tr-sm bg-blue-600 px-4 py-3 text-sm leading-6 text-white shadow-sm"
        : "markdown-body max-w-[84%] rounded-2xl rounded-tl-sm border border-slate-200 bg-white px-4 py-3 text-sm leading-6 text-slate-800 shadow-sm";

      if (isUser) {
        if (message.attachment?.filename) {
          const attachment = document.createElement("div");
          attachment.className = "mb-1 flex items-center gap-1 text-xs text-blue-100";
          attachment.textContent = `📄 ${message.attachment.filename}`;
          bubble.appendChild(attachment);
        }
        const content = document.createElement("div");
        content.textContent = message.content;
        bubble.appendChild(content);
      } else {
        if (message.activity?.length) {
          const toggleActivity = document.createElement("button");
          toggleActivity.type = "button";
          toggleActivity.className = "mb-2 text-xs text-blue-600 hover:text-blue-800";
          toggleActivity.textContent = message.activityCollapsed
            ? `展开运行过程（${message.activity.length} 条）`
            : `收起运行过程（${message.activity.length} 条）`;
          toggleActivity.setAttribute("aria-expanded", String(!message.activityCollapsed));
          toggleActivity.addEventListener("click", () => updateMessage(message.id, {
            activityCollapsed: !message.activityCollapsed
          }, false));
          bubble.appendChild(toggleActivity);

          if (!message.activityCollapsed) {
            const activity = document.createElement("div");
            activity.className = "mb-3 space-y-1 rounded-lg bg-slate-50 px-3 py-2 text-xs leading-5 text-slate-500";
            const title = document.createElement("div");
            title.className = "font-semibold text-slate-700";
            title.textContent = "Agent 执行过程";
            activity.appendChild(title);
            const tracedSteps = new Set(message.activity
              .filter((entry) => entry.type === "assistant_trace")
              .map((entry) => entry.step));
            const successfulToolCalls = new Set(message.activity
              .filter((entry) => entry.type === "tool_result" && entry.success)
              .map((entry) => entry.toolCallId));
            message.activity.forEach((entry) => {
              const item = document.createElement("div");
              if (entry.type === "agent") {
                item.className = entry.status === "completed" ? "text-emerald-600" : entry.status === "error" ? "text-rose-600" : "";
                item.textContent = entry.status === "completed" ? "✓ Agent 执行完成" : entry.status === "error" ? "⚠ Agent 执行失败" : "⏳ Agent 已启动";
              } else if (entry.type === "step") {
                item.className = "pt-1 font-semibold text-slate-700";
                item.textContent = `Step ${entry.step}`;
              } else if (entry.type === "llm") {
                if (tracedSteps.has(entry.step)) {
                  return;
                }
                item.className = entry.status === "completed" ? "text-emerald-600" : "";
                item.textContent = entry.status === "completed"
                  ? "✓ LLM 已生成下一步操作"
                  : entry.status === "recovery"
                    ? "⏳ Agent 正在尝试恢复..."
                    : "⏳ 正在分析请求...";
              } else if (entry.type === "assistant_trace") {
                const traceTitle = document.createElement("div");
                traceTitle.className = "font-semibold text-slate-700";
                traceTitle.textContent = "LLM:";
                const traceContent = document.createElement("div");
                traceContent.className = "whitespace-pre-wrap text-slate-600";
                traceContent.textContent = entry.content;
                item.append(traceTitle, traceContent);
              } else if (entry.type === "final") {
                item.className = entry.status === "completed" ? "text-emerald-600" : "";
                item.textContent = entry.status === "completed" ? "✓ 回答生成完成" : "⏳ 正在生成回答...";
              } else if (entry.type === "tool_call") {
                const title = document.createElement("div");
                title.className = `font-semibold ${successfulToolCalls.has(entry.toolCallId) ? "text-emerald-600" : "text-slate-700"}`;
                title.textContent = `✓ Tool Call: ${entry.name}`;
                const argumentsView = document.createElement("pre");
                argumentsView.className = "mt-1 overflow-x-auto rounded bg-slate-100 p-2 text-[11px] leading-4 text-slate-700";
                argumentsView.textContent = JSON.stringify(entry.arguments, null, 2);
                item.append(title, argumentsView);
              } else if (entry.type === "tool_start") {
                const prefix = entry.status === "error" ? "⚠" : entry.status === "completed" ? "✓" : "⏳";
                const action = entry.status === "running" ? "正在执行" : entry.status === "error" ? "执行失败" : "执行完成";
                item.className = entry.status === "completed" ? "text-emerald-600" : entry.status === "error" ? "text-rose-600" : "";
                item.textContent = `${prefix} ${action}: ${entry.name}`;
              } else if (entry.type === "tool_result") {
                item.innerHTML = `<span class="font-semibold ${entry.success ? "text-emerald-600" : "text-rose-600"}">${entry.success ? "✓" : "⚠"} Tool Result: ${escapeHtml(entry.name)}</span><br>${escapeHtml(entry.summary)}`;
              } else {
                item.textContent = `⚠ ${entry.content}`;
              }
              activity.appendChild(item);
            });
            bubble.appendChild(activity);
          }
        }
        if (message.content) {
          const answer = document.createElement("div");
          answer.innerHTML = marked.parse(message.content);
          answer.querySelectorAll("pre code").forEach((block) => hljs.highlightElement(block));
          bubble.appendChild(answer);
        }
      }

      if (isUser) {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }
      return row;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messageList.scrollTop = messageList.scrollHeight;
      });
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    async function newConversation() {
      if (isGenerating) {
        return;
      }
      const previousConversation = getActiveConversation();
      let cleanupError = "";
      if (previousConversation?.pendingAttachment) {
        try {
          setLoading(true, "正在移除未发送的 PDF 附件");
          await deletePendingAttachment(previousConversation);
        } catch (error) {
          cleanupError = `未能删除未发送的 PDF 附件：${error.message || "网络异常。"}`;
        } finally {
          setLoading(false, cleanupError);
        }
      }
      const sessionId = createUuid();
      conversations.unshift({
        sessionId,
        title: "新对话",
        paperId: null,
        activePaperIds: [],
        pendingAttachment: null,
        messages: []
      });
      activeSessionId = sessionId;
      saveCurrentSessionId();
      updateCurrentTitle();
      renderConversationList();
      renderMessages();
      renderPendingAttachment();
      try {
        const response = await fetch("/api/chat/sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId })
        });
        if (!response.ok) {
          throw new Error("创建会话失败。");
        }
      } catch (error) {
        statusText.textContent = error.message || "创建会话失败。";
      }
    }

    function updateCurrentTitle() {
      const conversation = getActiveConversation();
      currentTitle.textContent = conversation ? conversation.title : "新对话";
    }

    function addMessage(role, content, options = {}) {
      const conversation = getActiveConversation();
      if (!conversation) {
        return null;
      }
      const message = {
        id: createUuid(),
        role,
        content,
        loading: Boolean(options.loading),
        attachment: options.attachment || null,
        activity: Array.isArray(options.activity) ? options.activity : [],
        activityCollapsed: Boolean(options.activityCollapsed)
      };
      conversation.messages.push(message);
      renderMessages();
      return message;
    }

    function updateMessage(messageId, updates, shouldScroll = true) {
      const conversation = getActiveConversation();
      if (!conversation) {
        return;
      }
      const message = conversation.messages.find((item) => item.id === messageId);
      if (!message) {
        return;
      }
      Object.assign(message, updates);
      renderMessages(shouldScroll);
    }

    async function parseJsonResponse(response) {
      const text = await response.text();
      try {
        return text ? JSON.parse(text) : {};
      } catch {
        return { detail: text || "服务返回了无法解析的响应。" };
      }
    }

    function addRuntimeActivity(messageId, entry) {
      const conversation = getActiveConversation();
      const message = conversation?.messages.find((item) => item.id === messageId);
      if (!message) {
        return;
      }
      message.activity = [...(message.activity || []), entry];
      renderMessages();
    }

    function setRuntimeStatus(messageId, type, status, toolCallId = "") {
      const conversation = getActiveConversation();
      const message = conversation?.messages.find((item) => item.id === messageId);
      if (!message) {
        return;
      }
      for (let index = (message.activity || []).length - 1; index >= 0; index -= 1) {
        const entry = message.activity[index];
        if (entry.type === type && (!toolCallId || entry.toolCallId === toolCallId)) {
          entry.status = status;
          renderMessages();
          return;
        }
      }
    }

    function previousToolFailed(messageId) {
      const conversation = getActiveConversation();
      const activity = conversation?.messages.find((item) => item.id === messageId)?.activity || [];
      for (let index = activity.length - 1; index >= 0; index -= 1) {
        if (activity[index].type === "tool_result") {
          return activity[index].success === false;
        }
      }
      return false;
    }

    function appendMessageContent(messageId, delta) {
      const conversation = getActiveConversation();
      const message = conversation?.messages.find((item) => item.id === messageId);
      if (!message) {
        return;
      }
      message.content += delta;
      renderMessages();
    }

    async function readSse(response, onEvent) {
      if (!response.body) {
        throw new Error("浏览器不支持流式响应。");
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const message = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const data = message
            .split("\n")
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim())
            .join("\n");
          if (data) {
            onEvent(JSON.parse(data));
          }
        }
        if (done) {
          return;
        }
      }
    }

    function applyEventToConversationState(messageId, event) {
      switch (event.type) {
        case "agent_start":
          addRuntimeActivity(messageId, { type: "agent", status: "running" });
          break;
        case "step_start":
          addRuntimeActivity(messageId, { type: "step", step: event.step });
          break;
        case "llm_start":
          addRuntimeActivity(messageId, {
            type: "llm",
            step: event.step,
            status: previousToolFailed(messageId) ? "recovery" : "running"
          });
          break;
        case "assistant_trace":
          setRuntimeStatus(messageId, "llm", "completed");
          addRuntimeActivity(messageId, {
            type: "assistant_trace",
            step: event.step,
            content: event.content || ""
          });
          break;
        case "tool_call":
          setRuntimeStatus(messageId, "llm", "completed");
          addRuntimeActivity(messageId, {
            type: "tool_call",
            toolCallId: event.tool_call_id,
            name: event.name,
            arguments: event.arguments || {}
          });
          break;
        case "tool_start":
          addRuntimeActivity(messageId, {
            type: "tool_start",
            toolCallId: event.tool_call_id,
            name: event.name,
            status: "running"
          });
          break;
        case "tool_result":
          setRuntimeStatus(messageId, "tool_start", event.success ? "completed" : "error", event.tool_call_id);
          addRuntimeActivity(messageId, {
            type: "tool_result",
            toolCallId: event.tool_call_id,
            name: event.name,
            success: event.success === true,
            summary: event.summary || ""
          });
          break;
        case "final_start":
          setRuntimeStatus(messageId, "llm", "completed");
          addRuntimeActivity(messageId, { type: "final", step: event.step, status: "running" });
          updateMessage(messageId, { activityCollapsed: true });
          break;
        case "final_delta":
          appendMessageContent(messageId, event.delta || "");
          break;
        case "error":
          addRuntimeActivity(messageId, { type: "error", content: event.content || "Agent 执行失败" });
          break;
        case "agent_done":
          setRuntimeStatus(messageId, "final", "completed");
          setRuntimeStatus(messageId, "agent", event.status === "error" ? "error" : "completed");
          updateMessage(messageId, { loading: false });
          break;
      }
    }

    function replayPersistedEvents(events, incompleteTurnIds) {
      const assistantByTurn = new Map();
      const endedTurns = new Set();
      events.forEach((event) => {
        const data = event.data || {};
        const turnId = event.turn_id;
        if (event.event_type === "user/message") {
          addMessage("user", data.content || "");
          const assistant = addMessage("assistant", "", { loading: true, activityCollapsed: true });
          if (turnId) {
            assistantByTurn.set(turnId, assistant.id);
          }
          return;
        }
        const messageId = assistantByTurn.get(turnId);
        if (!messageId) {
          return;
        }
        switch (event.event_type) {
          case "step/start":
            applyEventToConversationState(messageId, { type: "step_start", step: event.step });
            break;
          case "assistant/trace":
            applyEventToConversationState(messageId, { type: "assistant_trace", step: event.step, content: data.content || "" });
            break;
          case "tool/call":
            applyEventToConversationState(messageId, {
              type: "tool_call", tool_call_id: data.tool_call_id, name: data.name, arguments: data.arguments || {}
            });
            break;
          case "tool/result":
            applyEventToConversationState(messageId, {
              type: "tool_result", tool_call_id: data.tool_call_id, name: data.name,
              success: data.status === "success", summary: data.summary || ""
            });
            break;
          case "assistant/message":
            updateMessage(messageId, { content: data.content || "", loading: false }, false);
            break;
          case "error":
            applyEventToConversationState(messageId, { type: "error", content: data.message || "Agent 执行失败" });
            break;
          case "turn/end":
            endedTurns.add(turnId);
            applyEventToConversationState(messageId, { type: "agent_done", status: data.status });
            break;
        }
      });
      new Set(incompleteTurnIds || []).forEach((turnId) => {
        const messageId = assistantByTurn.get(turnId);
        if (messageId && !endedTurns.has(turnId)) {
          applyEventToConversationState(messageId, { type: "error", content: "该轮执行未完整结束" });
          updateMessage(messageId, { loading: false }, false);
        }
      });
    }

    function applySessionHistory(sessions) {
      const existing = new Map(conversations.map((conversation) => [conversation.sessionId, conversation]));
      conversations = sessions.map((session) => {
        const previous = existing.get(session.session_id);
        return {
          sessionId: session.session_id,
          title: session.title || "新对话",
          paperId: session.current_paper_id || null,
          activePaperIds: previous?.activePaperIds || [],
          pendingAttachment: previous?.pendingAttachment || null,
          messages: previous?.messages || []
        };
      });
    }

    async function refreshSessionHistory() {
      const response = await fetch("/api/chat/sessions");
      if (!response.ok) {
        throw new Error("加载会话列表失败。");
      }
      const payload = await parseJsonResponse(response);
      applySessionHistory(Array.isArray(payload.sessions) ? payload.sessions : []);
      renderConversationList();
      return conversations;
    }

    async function restoreConversation(sessionId) {
      const response = await fetch(`/api/chat/sessions/${encodeURIComponent(sessionId)}`);
      if (response.status === 404) {
        return false;
      }
      if (!response.ok) {
        throw new Error("恢复会话失败。");
      }
      const payload = await parseJsonResponse(response);
      const session = payload.session || {};
      const restoredConversation = {
        sessionId: session.session_id,
        title: session.title || conversations.find((item) => item.sessionId === session.session_id)?.title || "新对话",
        paperId: session.current_paper_id || null,
        activePaperIds: Array.isArray(session.active_paper_ids) ? session.active_paper_ids : [],
        pendingAttachment: null,
        messages: []
      };
      const existingIndex = conversations.findIndex((item) => item.sessionId === session.session_id);
      if (existingIndex === -1) {
        conversations.unshift(restoredConversation);
      } else {
        conversations.splice(existingIndex, 1, restoredConversation);
      }
      activeSessionId = session.session_id;
      replayPersistedEvents(Array.isArray(payload.events) ? payload.events : [], payload.incomplete_turn_ids);
      saveCurrentSessionId();
      updateCurrentTitle();
      renderConversationList();
      renderMessages();
      renderPendingAttachment();
      return true;
    }

    async function switchConversation(sessionId) {
      if (isGenerating || sessionId === activeSessionId) {
        return;
      }
      try {
        await restoreConversation(sessionId);
      } catch (error) {
        statusText.textContent = error.message || "切换会话失败。";
      }
    }

    async function selectNextConversation() {
      const nextSessionId = conversations[0]?.sessionId;
      if (nextSessionId) {
        await restoreConversation(nextSessionId);
        return;
      }
      activeSessionId = "";
      clearSavedSessionId();
      renderConversationList();
      renderMessages();
      renderPendingAttachment();
      await newConversation();
    }

    async function deleteConversation(sessionId) {
      if (isGenerating) {
        statusText.textContent = "当前对话正在生成，请等待完成后再删除。";
        return;
      }
      if (!confirm("确定删除这个对话吗？")) {
        return;
      }
      const deletingCurrent = sessionId === activeSessionId;
      try {
        const response = await fetch(`/api/chat/sessions/${encodeURIComponent(sessionId)}`, { method: "DELETE" });
        if (!response.ok && response.status !== 404) {
          throw new Error("删除对话失败，请重试。");
        }
        conversations = conversations.filter((conversation) => conversation.sessionId !== sessionId);
        if (deletingCurrent) {
          await selectNextConversation();
        } else {
          renderConversationList();
        }
      } catch (error) {
        statusText.textContent = error.message || "删除对话失败，请重试。";
      }
    }

    async function initializeConversation() {
      let savedSessionId = "";
      try {
        savedSessionId = localStorage.getItem(CURRENT_SESSION_STORAGE_KEY) || "";
      } catch {
        // Fall through to a fresh in-memory session.
      }
      let sessions = [];
      try {
        sessions = await refreshSessionHistory();
      } catch (error) {
        statusText.textContent = error.message || "加载会话列表失败。";
      }
      const selectedSessionId = sessions.some((session) => session.sessionId === savedSessionId)
        ? savedSessionId
        : sessions[0]?.sessionId || "";
      if (selectedSessionId) {
        try {
          if (await restoreConversation(selectedSessionId)) {
            return;
          }
        } catch (error) {
          statusText.textContent = error.message || "恢复会话失败。";
        }
        if (savedSessionId) {
          clearSavedSessionId();
        }
      }
      await newConversation();
    }

    async function sendChatMessage() {
      const text = messageInput.value.trim();
      if (!text) {
        return;
      }
      const conversation = getActiveConversation();
      const pendingAttachment = conversation?.pendingAttachment;
      const sentAttachment = pendingAttachment ? { ...pendingAttachment } : null;
      const paperId = pendingAttachment?.paperId || conversation?.paperId || null;
      if (pendingAttachment && conversation?.pendingAttachment === pendingAttachment) {
        conversation.paperId = pendingAttachment.paperId;
        if (!conversation.activePaperIds.includes(pendingAttachment.paperId)) {
          conversation.activePaperIds.push(pendingAttachment.paperId);
        }
        conversation.pendingAttachment = null;
        renderPendingAttachment();
      }
      messageInput.value = "";
      resizeTextarea();
      addMessage("user", text, { attachment: sentAttachment });
      const assistantMessage = addMessage("assistant", "", { loading: true });
      const streamSessionId = activeSessionId;

      try {
        isGenerating = true;
        setLoading(true, "正在生成回复");
        let agentDone = false;
        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            session_id: activeSessionId,
            paper_id: paperId
          })
        });
        if (!response.ok) {
          const data = await parseJsonResponse(response);
          throw new Error(data.detail || "聊天请求失败。");
        }
        await readSse(response, (event) => {
          if (activeSessionId === streamSessionId) {
            applyEventToConversationState(assistantMessage.id, event);
          }
          agentDone ||= event.type === "agent_done";
        });
        if (!agentDone) {
          throw new Error("流式响应意外结束。");
        }
        try {
          await refreshSessionHistory();
        } catch (error) {
          statusText.textContent = error.message || "刷新会话列表失败。";
        }
      } catch (error) {
        updateMessage(assistantMessage.id, {
          content: `聊天失败：${error.message || "网络异常，请稍后重试。"}`,
          loading: false
        });
      } finally {
        isGenerating = false;
        setLoading(false);
      }
    }

    function uploadPdfWithProgress(file) {
      return new Promise((resolve, reject) => {
        const formData = new FormData();
        formData.append("file", file);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/papers/upload");

        xhr.upload.onprogress = (event) => {
          if (event.lengthComputable) {
            const percent = Math.max(1, Math.round((event.loaded / event.total) * 100));
            setUploadProgress(percent);
          } else {
            setUploadProgress(20, "正在上传 PDF...");
          }
        };

        xhr.onload = () => {
          const data = safeJsonParse(xhr.responseText);
          if (xhr.status >= 200 && xhr.status < 300) {
            setUploadProgress(100, "上传完成");
            resolve(data);
          } else {
            reject(new Error(data.detail || "上传失败，请检查 PDF 文件。"));
          }
        };

        xhr.onerror = () => reject(new Error("网络异常，上传失败。"));
        xhr.send(formData);
      });
    }

    function safeJsonParse(text) {
      try {
        return text ? JSON.parse(text) : {};
      } catch {
        return { detail: text || "服务返回了无法解析的响应。" };
      }
    }

    async function deletePendingAttachment(conversation) {
      const attachment = conversation?.pendingAttachment;
      if (!attachment) {
        return;
      }
      if (attachment.reused) {
        if (conversation.pendingAttachment === attachment) {
          conversation.pendingAttachment = null;
        }
        renderPendingAttachment();
        return;
      }
      const response = await fetch(`/api/papers/${encodeURIComponent(attachment.paperId)}`, {
        method: "DELETE"
      });
      const data = await parseJsonResponse(response);
      if (!response.ok) {
        throw new Error(data.detail || "删除 PDF 附件失败。");
      }
      if (conversation.pendingAttachment === attachment) {
        conversation.pendingAttachment = null;
      }
      renderPendingAttachment();
    }

    async function removePendingAttachment() {
      const conversation = getActiveConversation();
      if (!conversation?.pendingAttachment) {
        return;
      }
      let status = "";
      try {
        setLoading(true, "正在移除 PDF 附件");
        await deletePendingAttachment(conversation);
      } catch (error) {
        status = `删除 PDF 附件失败：${error.message || "网络异常。"}`;
      } finally {
        setLoading(false, status);
      }
    }

    async function handlePdfFile(file) {
      if (!file) {
        return;
      }
      if (!file.name.toLowerCase().endsWith(".pdf")) {
        statusText.textContent = "请选择 PDF 文件。";
        pdfInput.value = "";
        return;
      }

      const conversation = getActiveConversation();
      let status = "PDF 附件已就绪，可输入问题后发送";
      try {
        setLoading(true, "正在上传 PDF");
        if (conversation?.pendingAttachment) {
          await deletePendingAttachment(conversation);
        }
        setUploadProgress(1, "正在上传 PDF...");
        const uploadData = await uploadPdfWithProgress(file);
        const paperId = uploadData.paper_id;
        if (!paperId) {
          throw new Error("上传成功但未返回 paper_id。");
        }
        if (conversation) {
          conversation.pendingAttachment = {
            paperId,
            filename: uploadData.filename || file.name,
            reused: uploadData.reused === true
          };
        }
        renderPendingAttachment();
        messageInput.focus();
      } catch (error) {
        status = `PDF 上传失败：${error.message || "网络异常，请稍后重试。"}`;
      } finally {
        hideUploadProgress();
        setLoading(false, status);
        pdfInput.value = "";
      }
    }

    function resizeTextarea() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + "px";
    }

    newChatButton.addEventListener("click", newConversation);
    mobileNewChatButton.addEventListener("click", newConversation);
    sendButton.addEventListener("click", sendChatMessage);
    removePendingAttachmentButton.addEventListener("click", removePendingAttachment);
    messageInput.addEventListener("input", resizeTextarea);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendChatMessage();
      }
    });

    plusButton.addEventListener("click", () => {
      plusMenu.classList.toggle("hidden");
    });

    uploadPdfMenuItem.addEventListener("click", () => {
      plusMenu.classList.add("hidden");
      pdfInput.click();
    });

    arxivMenuItem.addEventListener("click", () => {
      plusMenu.classList.add("hidden");
      addMessage("assistant", "🔍 搜索 arxiv 即将推出。");
    });

    pdfInput.addEventListener("change", () => {
      handlePdfFile(pdfInput.files[0]);
    });

    document.addEventListener("click", (event) => {
      if (!plusMenu.contains(event.target) && !plusButton.contains(event.target)) {
        plusMenu.classList.add("hidden");
      }
    });

    initializeConversation();
  </script>
</body>
</html>
